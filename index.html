<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple TTS Loop App</title>
    
    <!-- Link to your external CSS style sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="char-counter">
        Characters: <span id="char-count">45</span>
        <br>
        Est. Read Time: <span id="time-estimate">0m 0s</span>
    </div>

    <div class="logo-container">
        <div class="logo-graphic panda-logo" aria-hidden="true"></div>
        
        <svg class="crawfish-svg" viewBox="0 0 44 38" width="44" height="38" xmlns="http://w3.org" aria-hidden="true">
            <path d="M19 14 C 15 6, 8 2, 2 8 M25 14 C 29 6, 36 2, 42 8" stroke="#991b1b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
            <path d="M16 22 L 10 24 M16 25 L 9 28 M16 28 L 10 32" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M28 22 L 34 24 M28 25 L 35 28 M28 28 L 34 32" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M18 19 Q 13 18 10 12" stroke="#991b1b" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M10 13 C 6 13, 3 9, 5 4 C 7 1, 12 3, 12 8 C 13 4, 15 5, 14 9 C 13 12, 11 13, 10 13 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
            <path d="M5 4 C 4 6, 5 9, 8 10" stroke="#991b1b" stroke-width="1" fill="none"/>
            <path d="M26 19 Q 31 18 34 12" stroke="#991b1b" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M34 13 C 38 13, 41 9, 39 4 C 37 1, 32 3, 32 8 C 31 4, 29 5, 30 9 C 31 12, 33 13, 34 13 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
            <path d="M39 4 C 40 6, 39 9, 36 10" stroke="#991b1b" stroke-width="1" fill="none"/>
            <path d="M17 16 C 16 11, 28 11, 27 16 L 27 25 C 27 28, 17 28, 17 25 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
            <path d="M22 10 L 20 13 H 24 Z" fill="#991b1b"/>
            <circle cx="19.5" cy="13" r="1.2" fill="#111827"/>
            <circle cx="24.5" cy="13" r="1.2" fill="#111827"/>
            <path d="M18 25 C 18 32, 26 32, 26 25 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="1"/>
            <path d="M19 28 C 19 34, 25 34, 25 28 Z" fill="#ef4444"/>
            <path d="M20 31 C 20 36, 24 36, 24 31 Z" fill="#dc2626"/>
        </svg>
    </div>

    <h2>Text to Speech Looper</h2>
    
    <div class="textarea-wrapper">
        <textarea id="text-box"></textarea>
        <div id="recall-viewer" class="hidden"></div>
    </div>
    
    <!-- Row 1: Core Action Controls (Now 4 Equal Buttons) -->
    <div class="action-button-row">
        <!-- Read button now serves as your Play/Pause toggle -->
        <button id="read-btn">Read</button>
        <button id="stop-btn" style="background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;">Stop</button>
        <button id="loop-check">Loop: OFF</button>
        <button id="clear-btn" style="background-color: #f3f4f6; border: 1px solid #d1d5db;">Clear</button>
    </div>

    <!-- Row 2: Secondary Text Utilities (3 Equal Buttons) -->
    <div class="action-button-row" style="margin-top: 5px;">
        <button id="hider-btn" style="background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;">Hide Words</button>
        <button id="tab-replace-btn" style="background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0;">Replace Space</button>
        <button id="remove-punks-btn" style="background-color: #fff7ed; color: #9a3412; border: 1px solid #ffedd5;">Remove Punks</button>
    </div>

    <div class="slider-timer-row">
        <div class="slider-container">
            <label class="slider-label">Reading Speed: <span id="speed-value">1.0x</span></label>
            <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1">
        </div>

        <div class="timer-container">
            <label>Reading Timer:</label>
            <span id="timer-display">00:00.0</span>
        </div>

        <div class="reset-container">
            <label>&nbsp;</label> 
            <button id="timer-reset-btn">Reset Timer</button>
        </div>
    </div>

    <div class="filter-search-row">
        <select id="gender-filter">
            <option value="all">Filter by: All Genders</option>
            <option value="female">Filter by: Female Only</option>
            <option value="male">Filter by: Male Only</option>
        </select>

        <input type="text" id="voice-search" placeholder="Search voices by name or language...">
    </div>

    <label for="voice-select">Choose Voice:</label>
    <select id="voice-select"></select>

    <script src="vietdiction.js"></script>
    
    <!-- NEW ARCHITECTURE PIPELINES -->
    <script src="timer.js"></script>
    <script src="speech.js"></script>
    <script src="hider.js"></script>
</body>
</html>
